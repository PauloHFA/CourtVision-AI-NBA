# Desenvolvimento local. A senha do Postgres é demonstrativa e só deve existir nesta máquina.
# Não use a tag flutuante do Ollama em produção; fixe digest depois de validar.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: courtvision
      POSTGRES_USER: courtvision
      POSTGRES_PASSWORD: localdev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtvision -d courtvision"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://courtvision:localdev@postgres:5432/courtvision
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-}
      BDL_API_KEY: ${BDL_API_KEY:-}
      API_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      APP_ENV: development
      MODEL_ARTIFACT_PATH: /app/models/champion.joblib
      INGESTION_RATE_PER_MIN: 4
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./models:/app/models

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_URL: http://127.0.0.1:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
  ollama_models:
